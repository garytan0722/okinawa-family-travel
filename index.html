<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b4a">
  <meta name="description" content="2026 沖繩親子自駕 A・B・C 行程手帳，可離線使用並記錄旅程。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>沖繩遛小孩｜沖繩親子自駕</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#app">跳到行程</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="回到行程首頁">
      <span class="brand-mark" aria-hidden="true">沖</span>
      <span><strong>沖繩遛小孩</strong><small>2026 · FAMILY ROAD BOOK</small></span>
    </a>
    <span id="network-status" class="network-pill" aria-live="polite">連線中</span>
  </header>

  <div class="app-shell">
    <aside class="side-rail" aria-label="旅程摘要">
      <p class="eyebrow">SEP 24 — OCT 04</p>
      <h1>沿著海風，<br>慢慢開。</h1>
      <p>兩大兩小出發，9/30 會合成四大兩小。三種節奏，一份能跟著旅況改變的手帳。</p>
      <div class="rail-stamp"><span>11</span> DAYS<br><small>OKINAWA</small></div>
    </aside>

    <main id="app" tabindex="-1">
      <section class="loading-card" aria-live="polite">
        <span class="loader" aria-hidden="true"></span>
        <p>正在攤開沖繩地圖…</p>
      </section>
    </main>

    <aside id="quick-panel" class="quick-panel" aria-label="行程工具">
      <p class="eyebrow">QUICK VIEW</p>
      <div id="quick-panel-content"><p>載入下一個固定行程…</p></div>
    </aside>
  </div>

  <nav class="bottom-nav" aria-label="主要功能">
    <a href="#/" data-route="home"><span aria-hidden="true">⌁</span><small>行程</small></a>
    <a href="#/logistics" data-route="logistics"><span aria-hidden="true">🚙</span><small>交通</small></a>
    <a href="#/emergency" data-route="emergency"><span aria-hidden="true">✚</span><small>緊急</small></a>
    <a href="#/records" data-route="records"><span aria-hidden="true">✎</span><small>記錄</small></a>
    <a href="#/sources" data-route="sources"><span aria-hidden="true">•••</span><small>更多</small></a>
  </nav>

  <noscript>這份行程需要 JavaScript 才能顯示與保存記錄。</noscript>
  <script src="./app.mjs" type="module"></script>
</body>
</html>
