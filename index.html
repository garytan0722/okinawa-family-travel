<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ec">
  <meta name="description" content="2026 沖繩親子自駕 A・B・C 行程手帳，可離線使用並記錄旅程。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>沖繩遛小孩｜沖繩親子自駕</title>
  <link rel="manifest" href="./manifest.json?v=17">
  <link rel="icon" href="./icons/icon.svg?v=17" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=17">
</head>
<body>
  <a class="skip-link" href="#app">跳到行程</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="回到行程首頁">
      <span class="brand-mark" aria-hidden="true"><span class="brand-paw paw-print"></span></span>
      <span><strong>沖繩遛小孩</strong><small>2026 · PAW PAW ROAD BOOK</small></span>
    </a>
    <span id="network-status" class="network-pill" aria-live="polite">連線中</span>
  </header>

  <div class="app-shell">
    <aside class="side-rail" aria-label="旅程摘要">
      <p class="eyebrow">SEP 24 — OCT 04</p>
      <h1>跟著小腳印，<br>慢慢玩。</h1>
      <p>譚家一家四口出發，9/30 與曾蘿情侶會合，六人同行到 10/4。三種節奏，一份能跟著旅況改變的手帳。</p>
      <div class="rail-stamp"><span>11</span> DAYS<br><small>OKINAWA</small><i class="paw-print" aria-hidden="true"></i></div>
    </aside>

    <main id="app" tabindex="-1">
      <section class="loading-card" aria-live="polite">
        <span class="loader" aria-hidden="true"><span class="paw-print"></span></span>
        <p>汪喵小隊長正在攤開地圖…</p>
        <p id="recovery-hint" class="recovery-hint" hidden>一直載入不出來？<a href="./recovery.html?v=17">修復網站後重開</a></p>
      </section>
    </main>

    <aside id="quick-panel" class="quick-panel" aria-label="行程工具">
      <p class="eyebrow">QUICK VIEW</p>
      <div id="quick-panel-content"><p>載入下一個固定行程…</p></div>
    </aside>
  </div>

  <nav class="bottom-nav" aria-label="主要功能">
    <a href="#/" data-route="home"><span class="nav-paw" aria-hidden="true"><i class="paw-print"></i></span><small>行程</small></a>
    <a href="#/logistics" data-route="logistics"><span aria-hidden="true">🚙</span><small>交通</small></a>
    <a href="#/emergency" data-route="emergency"><span aria-hidden="true">✚</span><small>緊急</small></a>
    <a href="#/records" data-route="records"><span aria-hidden="true">✎</span><small>記錄</small></a>
    <a href="#/sources" data-route="sources"><span aria-hidden="true">•••</span><small>更多</small></a>
  </nav>

  <noscript>這份行程需要 JavaScript 才能顯示與保存記錄。</noscript>
  <script>
    setTimeout(() => {
      if (document.querySelector('.loading-card')) document.querySelector('#recovery-hint')?.removeAttribute('hidden');
    }, 8000);
  </script>
  <script src="./app.mjs?v=17" type="module"></script>
</body>
</html>
